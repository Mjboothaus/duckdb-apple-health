#
# Build/test extension binaries via DuckDB extension-ci-tools.
# macOS only for now (matches community publish intent).
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      # DuckDB *release* used to compile/test (not the C extension API stamp).
      # Makefile TARGET_DUCKDB_VERSION stays at v1.2.0 (stable C API metadata).
      # Align with community-extensions DUCKDB_LATEST_STABLE.
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: apple_health
      extra_toolchains: python3
      # Skip non-macOS matrix entries (linux / windows / wasm)
      exclude_archs: >-
        linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;
        windows_amd64;windows_arm64;windows_amd64_mingw;windows_amd64_rtools;
        wasm_mvp;wasm_eh;wasm_threads
