[project]
name = "duckdb-apple-health-notebooks"
version = "0.1.0"
description = "Exploratory marimo notebooks for the duckdb-apple-health extension"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.13.0",
    "duckdb>=1.2.0",
    "pandas>=2.2.0",
    "altair>=5.4.0",
    "polars>=1.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "healthkit-to-sqlite>=1.0.1",
    "pytest>=9.1.1",
]
